<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jugando — Cartuchera</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14162A; --surface:#1D2038; --ink:#E7E8F2; --muted:#9A9EBB; --line:#2E3253; --accent:#A49BFF;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:14px;padding:12px clamp(12px,3vw,28px);border-bottom:1px solid var(--line)}
.back{color:var(--ink);text-decoration:none;font-weight:700;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;white-space:nowrap}
.back:hover{border-color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.title{min-width:0}
.title h1{font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3vw,1.5rem);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p{margin:0;color:var(--muted);font-size:.85rem}
.swatch{width:14px;height:14px;border-radius:3px;flex:none}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:clamp(0px,2vw,20px)}
#game-wrap{width:100%;height:100%;max-width:min(100%,calc((100vh - 140px) * var(--ratio)));max-height:100%;aspect-ratio:var(--ratio)}
#game{width:100%;height:100%}
.note{padding:10px clamp(12px,3vw,28px) 14px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
.note p{margin:0;max-width:80ch}
.msg{max-width:52ch;text-align:center;padding:40px 20px}
.msg h2{font-family:var(--display);margin:0 0 8px}
.msg code{background:var(--surface);padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="./">Volver</a>
  <span class="swatch" id="swatch"></span>
  <div class="title"><h1 id="t">Cargando…</h1><p id="s"></p></div>
</div>
<div class="stage" id="stage"><div id="game-wrap"><div id="game"></div></div></div>
<div class="note"><p>Guardá dentro del juego como siempre: la partida queda almacenada en este navegador. Desde el menú del emulador podés cambiar los controles, crear estados rápidos y exportar tu partida para pasarla a otro dispositivo.</p></div>

<script src="games.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const g = GAMES.find(x => x.id === id);
  const stage = document.getElementById('stage');
  const fail = (h, p) => { stage.innerHTML = `<div class="msg"><h2>${h}</h2><p>${p}</p></div>`; document.getElementById('t').textContent = h; };

  if (!g) return fail('Juego no encontrado', 'Volvé a la biblioteca y elegí un juego de la lista.');

  const p = PLATFORMS[g.platform];
  document.title = `${g.title} — Cartuchera`;
  document.getElementById('t').textContent = g.title;
  document.getElementById('s').textContent = `${p.name}, ${g.year}`;
  document.getElementById('swatch').style.background = g.color;
  // Proporción de pantalla: GB/GBC 10:9, GBA 3:2, DS dos pantallas apiladas 4:6
  const ratios = { gb: 10/9, gbc: 10/9, gba: 3/2, nds: 2/3 };
  document.getElementById('game-wrap').style.setProperty('--ratio', ratios[g.platform]);

  // Verifica que el ROM exista antes de iniciar el emulador
  try {
    const r = await fetch(g.rom, { method: 'HEAD' });
    if (!r.ok) throw 0;
  } catch {
    return fail('Falta el archivo del juego', `Subí el ROM a <code>${g.rom}</code> y recargá la página.`);
  }

  // Configuración de EmulatorJS
  window.EJS_player = '#game';
  window.EJS_core = p.core;
  window.EJS_gameUrl = g.rom;
  window.EJS_gameName = g.id;            // nombre usado para guardar partidas (no cambiarlo después)
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_color = g.color;
  window.EJS_language = 'es-ES';
  window.EJS_backgroundColor = '#14162A';

  const s = document.createElement('script');
  s.src = EJS_pathtodata + 'loader.js';
  s.onerror = () => fail('No se pudo cargar el emulador', 'Revisá tu conexión a internet y recargá la página.');
  document.body.appendChild(s);
})();
</script>
</body>
</html>

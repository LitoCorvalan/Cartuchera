<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jugando — Cartuchera</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14162A; --surface:#1D2038; --surface2:#262A48; --ink:#E7E8F2; --muted:#9A9EBB; --line:#2E3253; --accent:#A49BFF;
  --ok:#5BD38A; --warn:#F2C14E; --bad:#F06A6A;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button,input,select{font:inherit;color:inherit}

.bar{display:flex;align-items:center;gap:14px;padding:12px clamp(12px,3vw,28px);border-bottom:1px solid var(--line)}
.back{color:var(--ink);text-decoration:none;font-weight:700;padding:6px 14px;border:1.5px solid var(--line);border-radius:999px;white-space:nowrap}
.back:hover{border-color:var(--ink)}
.title{min-width:0}
.title h1{font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3vw,1.5rem);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p{margin:0;color:var(--muted);font-size:.85rem}
.swatch{width:14px;height:14px;border-radius:3px;flex:none}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"game team" "opts team";gap:18px 24px;padding:18px clamp(12px,3vw,28px) 32px;max-width:1400px;margin:0 auto}
.layout.no-team{grid-template-columns:minmax(0,1fr);grid-template-areas:"game" "opts"}
.game-area{grid-area:game;display:flex;justify-content:center}
#game-wrap{width:min(100%, calc((100dvh - 230px) * var(--ratio)));aspect-ratio:var(--ratio);background:#000;border-radius:8px;overflow:hidden}
#game{width:100%;height:100%}
/* Oculta la barra y el menú propios del emulador: las opciones están afuera */
.ejs_menu_bar,.ejs_context_menu{display:none!important}

/* Opciones */
.opts{grid-area:opts;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-start}
.group{display:flex;flex-direction:column;gap:8px}
.group h2,.team h2{font-family:var(--display);font-weight:500;font-size:1rem;margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.vol{display:flex;align-items:center;gap:8px;font-size:.9rem}
.vol input{width:110px;accent-color:var(--accent)}
.slots{display:grid;grid-template-columns:auto auto auto;gap:6px 8px;align-items:center;font-size:.9rem}
.slots .when{color:var(--muted);min-width:9ch}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 14px;font-size:.88rem;color:var(--muted);min-width:260px}
.keys kbd{font:inherit;color:var(--ink);background:var(--surface2);border-radius:4px;padding:0 6px;margin-left:4px}
@media (pointer:coarse){.keys-group{display:none!important}}
.settings{width:100%;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.settings summary{font-family:var(--display);font-weight:500;font-size:1.1rem;cursor:pointer;width:max-content;padding:2px 0}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:14px;align-items:start}
.set-group{border:1px solid var(--line);border-radius:10px;padding:10px 14px 14px;margin:0;min-width:0;display:flex;flex-direction:column;gap:10px}
.set-group legend{padding:0 6px;font-weight:700;font-size:.92rem}
.set-row{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.set-row select{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
.set-loading{color:var(--muted);font-size:.9rem;margin:0}
#keys{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:.9rem}
#keys kbd{font:inherit;font-weight:700;background:var(--surface2);border-radius:4px;padding:1px 8px;min-width:2.5em;text-align:center}
#keys .k{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.listening{border-color:var(--warn);color:var(--warn)}
.status{font-size:.85rem;color:var(--muted);width:100%;margin:0}
.status:empty{display:none}

/* Equipo */
.team{grid-area:team;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.team-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.switch{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer}
.switch input{accent-color:var(--accent);width:18px;height:18px}
.team ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mon{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:6px 10px 8px 6px}
.mon img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated}
.mon .name{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.mon .nick{font-weight:400;color:var(--muted);font-size:.85rem}
.mon .lvl{font-size:.85rem;color:var(--muted)}
.shiny{color:var(--warn);font-size:.8rem;font-weight:700}
.hp{height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.hp i{display:block;height:100%;border-radius:3px}
.hp-txt{font-size:.75rem;color:var(--muted);margin-top:2px}
.egg{width:34px;height:44px;margin:10px auto;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 35%,#fff,#E9E3CF 60%,#C9BFA0);box-shadow:inset -4px -4px 0 rgba(0,0,0,.08)}
.team-note{font-size:.82rem;color:var(--muted);margin:12px 0 0}
.team-empty{font-size:.9rem;color:var(--muted);margin:0}
.team.collapsed ol,.team.collapsed .team-note,.team.collapsed .team-empty{display:none}
.team.collapsed .team-head{margin-bottom:0}

.btn.primary{background:var(--accent);border-color:var(--accent);color:#14162A;font-weight:700}
.team-actions{margin-top:12px}
.team.collapsed .team-actions{display:none}

/* Intercambio */
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:0;width:min(760px,calc(100% - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(8,9,20,.7)}
.t-head{display:flex;justify-content:flex-end;padding:10px 10px 0}
.t-x{background:none;border:0;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 10px;border-radius:6px}
#trade-body{padding:0 24px 24px}
#trade-body h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0 0 8px}
#trade-body h3{font-size:.9rem;color:var(--muted);font-weight:700;margin:0 0 8px}
#trade-body p{margin:0 0 14px;max-width:62ch}
.t-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.t-or{color:var(--muted);font-size:.9rem;margin-top:22px!important}
.t-join{display:flex;gap:8px}
.t-join input{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;width:9ch;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.t-code{font-family:var(--display);font-weight:800;font-size:2.6rem;letter-spacing:.12em;margin:4px 0 14px!important}
.t-wait{color:var(--muted)}
.t-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:14px 0}
.t-list{display:flex;flex-direction:column;gap:6px}
.t-mon{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:4px 10px 4px 4px;border:2px solid transparent;font-size:.92rem}
.t-mon img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}
.t-mon .lvl{color:var(--muted);font-size:.82rem}
.t-mon.dim{opacity:.45}
.t-mon.sel{border-color:var(--accent)}
.t-mon.empty{color:var(--muted);padding:16px}
.t-pick{display:block;cursor:pointer}
.t-pick input{position:absolute;opacity:0}
.t-pick input:checked + .t-mon{border-color:var(--accent)}
.t-pick input:focus-visible + .t-mon{outline:3px solid var(--accent);outline-offset:2px}
.t-evo{color:var(--warn);font-size:.9rem;margin-top:10px!important}
.t-state{color:var(--muted)}
.egg.sm{width:26px;height:34px;margin:7px 11px}
@media (max-width:620px){.t-cols{grid-template-columns:1fr}}

.dl{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#ddd;font-size:.95rem}
.dl p{margin:0}
.dl-bar{width:min(320px,70%);height:8px;background:#333;border-radius:4px;overflow:hidden}
.dl-bar i{display:block;height:100%;width:0;background:var(--accent)}
.dl{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:20px;text-align:center;color:#ddd;font-size:.95rem}
.dl p{margin:0;max-width:40ch}
.dl-bar{width:min(320px,80%);height:8px;background:#333;border-radius:4px;overflow:hidden}
.dl-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.msg{max-width:52ch;text-align:center;padding:40px 20px;margin:0 auto}
.msg h2{font-family:var(--display);margin:0 0 8px}
.msg code{background:var(--surface);padding:2px 6px;border-radius:4px}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"game" "team" "opts"}
  .team{position:static}
  #game-wrap{width:min(100%, calc((100dvh - 160px) * var(--ratio)))}
}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="./">Volver</a>
  <span class="swatch" id="swatch"></span>
  <div class="title"><h1 id="t">Cargando…</h1><p id="s"></p></div>
</div>

<div class="layout" id="layout">
  <div class="game-area" id="stage"><div id="game-wrap"><div id="game"></div></div></div>

  <div class="opts" id="opts">
    <div class="group">
      <h2>Juego</h2>
      <div class="row">
        <button class="btn" id="b-pause" aria-pressed="false" disabled>Pausar</button>
        <button class="btn" id="b-restart" disabled>Reiniciar</button>
        <button class="btn" id="b-fast" aria-pressed="false" disabled>Avance rápido</button>
        <button class="btn" id="b-full" disabled>Pantalla completa</button>
      </div>
      <label class="vol">Volumen <input type="range" id="vol" min="0" max="1" step="0.05" value="0.5" disabled></label>
    </div>

    <div class="group">
      <h2>Estados rápidos</h2>
      <div class="slots" id="slots"></div>
    </div>

    <div class="group">
      <h2>Partida guardada</h2>
      <div class="row">
        <button class="btn" id="b-export" disabled>Descargar partida</button>
        <button class="btn" id="b-import" disabled>Cargar partida desde archivo</button>
        <input type="file" id="f-import" accept=".sav,.srm,.dsv,.sa1,.sa2" hidden>
        <button class="btn" id="b-restore" hidden>Restaurar partida previa al último intercambio</button>
      </div>
    </div>

    <p class="status" id="status" role="status"></p>

    <details class="settings" id="settings" open>
      <summary>Configuración del emulador</summary>
      <div class="settings-grid" id="settings-grid">
        <fieldset class="set-group keys-group">
          <legend>Teclado</legend>
          <div id="keys"></div>
          <div class="row">
            <button class="btn sm" id="b-keys-reset" disabled>Restablecer teclas</button>
            <button class="btn sm" id="b-pad" disabled>Configurar joystick</button>
          </div>
        </fieldset>
        <p class="set-loading" id="set-loading">Las opciones aparecen cuando el juego termina de cargar.</p>
      </div>
    </details>
  </div>

  <aside class="team" id="team" hidden>
    <div class="team-head">
      <h2>Tu equipo</h2>
      <label class="switch"><input type="checkbox" id="team-toggle" checked> Mostrar</label>
    </div>
    <ol id="team-list"></ol>
    <p class="team-empty" id="team-empty">Guardá la partida dentro del juego y tu equipo aparece acá.</p>
    <p class="team-note">Se actualiza cada vez que guardás dentro del juego.</p>
    <div class="team-actions"><button class="btn primary" id="b-trade" disabled>Intercambiar en línea</button></div>
  </aside>
</div>

<dialog id="trade" aria-label="Intercambio">
  <div class="t-head"><button class="t-x" aria-label="Cerrar" onclick="this.closest('dialog').close()">×</button></div>
  <div id="trade-body"></div>
</dialog>

<script src="games.js"></script>
<script src="party.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const id = new URLSearchParams(location.search).get('id');
  const g = GAMES.find(x => x.id === id);
  const status = msg => { $('status').textContent = msg; };
  const fail = (h, p) => {
    $('layout').innerHTML = `<div class="msg"><h2>${h}</h2><p>${p}</p></div>`;
    $('layout').classList.add('no-team'); $('t').textContent = h;
  };

  if (!g) return fail('Juego no encontrado', 'Volvé a la biblioteca y elegí un juego de la lista.');

  const p = PLATFORMS[g.platform];
  document.title = `${g.title} — Cartuchera`;
  $('t').textContent = g.title;
  $('s').textContent = `${p.name}, ${g.year}`;
  $('swatch').style.background = g.color;
  const ratios = { gb: 10/9, gbc: 10/9, gba: 3/2, nds: 2/3 };
  $('game-wrap').style.setProperty('--ratio', ratios[g.platform]);
  if (g.party) $('team').hidden = false; else $('layout').classList.add('no-team');

  // ---------- Teclado (reasignable) ----------
  const BTN = { 0:'B', 1:'Y', 2:'Select', 3:'Start', 4:'Arriba', 5:'Abajo', 6:'Izquierda', 7:'Derecha', 8:'A', 9:'X', 10:'L', 11:'R' };
  const USED = { gb:[8,0,3,2,4,5,6,7], gbc:[8,0,3,2,4,5,6,7], gba:[8,0,10,11,3,2,4,5,6,7], nds:[8,0,9,1,10,11,3,2,4,5,6,7] }[g.platform];
  const PRETTY = { 'up arrow':'↑', 'down arrow':'↓', 'left arrow':'←', 'right arrow':'→', 'enter':'Enter', 'space':'Espacio', 'shift':'Shift',
    'ctrl':'Ctrl', 'alt':'Alt', 'tab':'Tab', 'backspace':'Retroceso', 'escape':'Esc' };
  const keyName = code => { const n = emu()?.keyMap?.[code]; return n ? (PRETTY[n] || n.toUpperCase()) : '—'; };
  let listening = null;
  function renderKeys(){
    const c = emu()?.controls?.[0] || {};
    $('keys').innerHTML = USED.map(i => `<span>${BTN[i]}</span><span class="k"><kbd>${keyName(c[i]?.value)}</kbd>
      <button class="btn sm" data-key="${i}" ${ready ? '' : 'disabled'}>Cambiar</button></span>`).join('')
      + (g.platform === 'nds' ? '<span>Pantalla táctil</span><span class="k">Mouse</span>' : '');
  }
  $('keys').onclick = e => {
    const b = e.target.closest('[data-key]'); if (!b || !ready) return;
    listening = +b.dataset.key; renderKeys();
    const btn = $('keys').querySelector(`[data-key="${listening}"]`);
    btn.textContent = 'Presioná una tecla…'; btn.classList.add('listening');
  };
  window.addEventListener('keydown', e => {
    if (listening === null) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const i = listening; listening = null;
    if (e.key !== 'Escape') {
      const c = emu().controls[0];
      const prev = c[i]?.value;
      // Si la tecla ya estaba en otro botón, se intercambian
      for (const j of USED) if (j !== i && c[j]?.value === e.keyCode) c[j] = { ...c[j], value: prev };
      c[i] = { ...(c[i] || {}), value: e.keyCode };
      try { emu().saveSettings(); } catch {}
      status(`${BTN[i]} ahora es ${keyName(e.keyCode)}.`);
    }
    renderKeys(); focusGame();
  }, true);

  // ---------- Estados rápidos (IndexedDB propio) ----------
  const db = await new Promise(res => {
    try {
      const r = indexedDB.open('cartuchera', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('states');
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    } catch { res(null); }
  });
  const idb = (mode, fn) => new Promise((res, rej) => {
    if (!db) return rej(new Error('sin almacenamiento'));
    const tx = db.transaction('states', mode), st = tx.objectStore('states'), r = fn(st);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const fmt = t => new Date(t).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  async function renderSlots(){
    let html = '';
    for (const n of [1,2,3]){
      let st = null; try { st = await idb('readonly', s => s.get(`${g.id}:${n}`)); } catch {}
      html += `<span class="when">Ranura ${n}: ${st ? fmt(st.time) : 'vacía'}</span>
        <button class="btn" data-save="${n}" ${ready?'':'disabled'}>Guardar</button>
        <button class="btn" data-load="${n}" ${ready && st ? '' : 'disabled'}>Cargar</button>`;
    }
    $('slots').innerHTML = html;
  }
  let ready = false;
  renderSlots();

  // ---------- ROM: archivo único o dividido en partes ----------
  // Si el ROM no está entero pero existen rom.001, rom.002, … (partes de dividir.html o 7-Zip),
  // se detectan solas; "parts" en games.js es opcional. Se unen en el navegador y quedan en caché.
  const partName = i => `${g.rom}.${String(i).padStart(3, '0')}`;
  const exists = async url => { try { const r = await fetch(url, { method: 'HEAD', cache: 'no-store' }); return r.status === 404 ? false : r.ok ? true : null; } catch { return null; } };
  let partUrls = null;
  if (g.parts) partUrls = [...Array(g.parts)].map((_, i) => partName(i + 1));
  else if (await exists(g.rom) === false) {
    if (await exists(partName(1))) {
      let n = 1; while (n < 200 && await exists(partName(n + 1))) n++;
      partUrls = [...Array(n)].map((_, i) => partName(i + 1));
    } else {
      return fail('Falta el archivo del juego', `No se encontró <code>${esc(g.rom)}</code> ni sus partes (<code>${esc(partName(1))}</code>, …). Revisá el nombre y la carpeta en GitHub: deben coincidir exactamente con <code>games.js</code>, incluidas mayúsculas y minúsculas.`);
    }
  }
  if (partUrls && await exists(partUrls[0]) === false)
    return fail('Falta una parte del juego', `No se encontró <code>${esc(partUrls[0])}</code>. Revisá el nombre en GitHub.`);

  let gameUrl = g.rom;
  if (partUrls) {
    const wrap = $('game');
    wrap.innerHTML = '<div class="dl"><p id="dl-txt">Preparando el juego…</p><div class="dl-bar"><i id="dl-bar"></i></div></div>';
    let cache = null; try { cache = await caches.open('cartuchera-roms-v1'); } catch {}
    const blobs = [];
    try {
      for (let i = 0; i < partUrls.length; i++) {
        const url = new URL(partUrls[i], location.href).href;
        let res = cache && await cache.match(url);
        if (!res) {
          const net = await fetch(url);
          if (!net.ok) throw new Error(`parte ${i + 1}: ${net.status}`);
          if (cache) { try { await cache.put(url, net.clone()); } catch {} }
          res = net;
        }
        blobs.push(await res.blob());
        const pct = Math.round((i + 1) / partUrls.length * 100);
        $('dl-txt').textContent = `Descargando el juego: ${pct}% (se guarda en este dispositivo para la próxima vez)`;
        $('dl-bar').style.width = pct + '%';
      }
    } catch (err) {
      console.warn(err);
      return fail('No se pudo descargar el juego', 'Revisá tu conexión y que estén subidas todas las partes del ROM.');
    }
    gameUrl = URL.createObjectURL(new Blob(blobs));
    wrap.innerHTML = '';
  }

  // ---------- EmulatorJS ----------
  window.EJS_player = '#game';
  window.EJS_core = g.core || p.core;
  window.EJS_gameUrl = gameUrl;
  window.EJS_gameName = g.id;               // identifica las partidas guardadas: no cambiarlo
  // Si las partes son de un ROM sin comprimir, el emulador necesita la extensión (.nds, .gba…) en el nombre
  const romFile = g.rom.split('/').pop();
  if (partUrls && !/\.(zip|7z|rar)$/i.test(romFile)) window.EJS_gameName = romFile;
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/4.2.3/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_language = 'es-ES';
  window.EJS_color = g.color;
  window.EJS_backgroundColor = '#000000';
  window.EJS_volume = 0.5;
  window.EJS_Buttons = { playPause:false, restart:false, mute:false, settings:false, fullscreen:false, saveState:false, loadState:false,
    screenRecord:false, gamepad:false, cheat:false, volume:false, saveSavFiles:false, loadSavFiles:false, quickSave:false,
    quickLoad:false, screenshot:false, cacheManager:false, exitEmulation:false, netplay:false, diskButton:false, contextMenu:false };
  // La partida se copia al almacenamiento del navegador cada 30 segundos (por defecto eran 5 minutos)
  // En DS el lápiz sigue la posición real del cursor (modo táctil) en vez de moverse de forma relativa
  window.EJS_defaultOptions = { 'save-save-interval': '30', 'desmume_pointer_type': 'touch', 'melonds_touch_mode': 'Touch' };
  // Ajustes del menú interno que no aplican porque sus botones están reemplazados por el panel propio
  window.EJS_hideSettings = ['menubarBehavior', 'save-state-slot', 'save-state-location', 'fastForward', 'menu-bar-button', 'lockMouse', 'altKeyboardInput',
    'screenshotSource', 'screenshotFormat', 'screenshotUpscale', 'screenRecordFPS', 'screenRecordFormat', 'screenRecordUpscale', 'screenRecordVideoBitrate', 'screenRecordAudioBitrate'];

  const emu = () => window.EJS_emulator;
  const gm = () => window.EJS_emulator?.gameManager;

  function onReady(){
    if (ready) return; ready = true;
    // EmulatorJS bloquea el cursor dentro del juego en los núcleos con mouse (DS): se desactiva
    try { emu().enableMouseLock = false; if (document.pointerLockElement) document.exitPointerLock(); } catch {}
    document.querySelectorAll('.opts .btn:not(#b-restore), #vol').forEach(b => b.disabled = false);
    $('vol').value = emu()?.volume ?? 0.5;
    renderSlots(); renderKeys(); buildSettings();
    if (g.party) {
      updateTeam(); setInterval(updateTeam, 4000); showRestore();
      window.Cartuchera = { game:g, readSave, writeSave, backup, status, reload: () => reloadWith('Intercambio guardado en tu partida.'),
        pause: v => { try { if (v !== paused) setPaused(v); } catch {} },
        refreshTeam: () => { lastTeam = ''; setTimeout(updateTeam, 1500); } };
      const t = document.createElement('script'); t.src = 'trade.js';
      t.onload = () => { $('b-trade').disabled = false; };
      document.body.appendChild(t);
    }
  }
  window.EJS_onGameStart = onReady;
  // Si hay una partida de melonDS y todavía no de DeSmuME, se copia antes de que arranque el juego
  window.EJS_ready = () => emu().on('saveDatabaseLoaded', FS => {
    if (g.platform !== 'nds' || !/^desmume$/.test(emu().getCore())) return;
    try {
      const ex = q => FS.analyzePath(q).exists;
      const romBase = g.rom.split('/').pop().replace(/\.(zip|7z|rar)$/i, '').replace(/\.[^.]+$/, '');
      for (const base of [...new Set([romBase, g.id])]) {
        const dsv = `/data/saves/DeSmuME/${base}.dsv`, sav = `/data/saves/DeSmuME/${base}.sav`, mel = `/data/saves/melonDS/${base}.sav`;
        if (!ex(dsv) && !ex(sav) && ex(mel)) {
          if (!ex('/data/saves/DeSmuME')) FS.mkdir('/data/saves/DeSmuME');
          FS.writeFile(sav, FS.readFile(mel));
          status('Se trasladó tu partida al nuevo núcleo de DS.');
        }
      }
    } catch (err) { console.warn('migración', err); }
  });
  const poll = setInterval(() => { if (gm()) { clearInterval(poll); setTimeout(onReady, 1500); } }, 500);

  const s = document.createElement('script');
  s.src = EJS_pathtodata + 'loader.js';
  s.onerror = () => fail('No se pudo cargar el emulador', 'Revisá tu conexión a internet y recargá la página.');
  document.body.appendChild(s);

  // ---------- Acciones ----------
  // Devuelve el foco al emulador para que el teclado siga controlando el juego
  const focusGame = () => { try { emu()?.elements?.parent?.focus({ preventScroll:true }); } catch {} };
  const giveFocusBack = focusGame;

  // Evita que la página se desplace con flechas, espacio, etc. mientras se juega
  // (EmulatorJS ignora las teclas repetidas al mantenerlas apretadas y no frena el scroll)
  const NAV_KEYS = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar','PageUp','PageDown','Home','End']);
  window.addEventListener('keydown', e => {
    if (NAV_KEYS.has(e.key) && e.target.closest?.('#game-wrap')) e.preventDefault();
  }, { capture:true });

  // ---------- Configuración completa del emulador ----------
  // Se arma a partir del menú interno de EmulatorJS (que queda oculto) y cada cambio usa su propio botón,
  // así las opciones se guardan y aplican igual que en el menú original.
  const TR = {
    'Graphics Settings':'Imagen', 'Speed Options':'Velocidad', 'Input Options':'Controles', 'Save States':'Guardado',
    'Mando Virtual':'Controles táctiles', 'Virtual Gamepad':'Controles táctiles', 'Backend Core Options':'Núcleo del emulador', 'General':'General',
    'Shaders':'Filtro de imagen', 'WebGL2 (Requires restart)':'WebGL2 (requiere reiniciar)', 'FPS':'Mostrar FPS', 'VSync':'Sincronización vertical',
    'Video Rotation':'Rotación de pantalla', 'Proporción de Avance Rápido':'Velocidad del avance rápido', 'Cámara Lenta':'Cámara lenta',
    'Proporción de Cámara Lenta':'Velocidad de la cámara lenta', 'Rewind Enabled (Requires restart)':'Rebobinado (requiere reiniciar)',
    'Granularidad de Rebobinado':'Precisión del rebobinado', 'Direct Keyboard Input':'Entrada directa de teclado',
    'System Save interval':'Guardar la partida en el navegador cada', 'Core (Requires restart)':'Núcleo (requiere reiniciar)',
    'Threads':'Usar varios hilos', 'Modo para Zurdos':'Modo zurdo', 'Disk':'Disco',
    // Núcleos
    'gb colorization':'Colorear juegos de Game Boy', 'gb internal palette':'Paleta interna', 'gb palette twb64 1':'Paleta TWB64 (1)',
    'gb palette twb64 2':'Paleta TWB64 (2)', 'gb palette twb64 3':'Paleta TWB64 (3)', 'gb palette pixelshift 1':'Paleta PixelShift',
    'gbc color correction':'Corrección de color', 'gbc color correction mode':'Modo de corrección de color',
    'gbc frontlight position':'Posición de la luz frontal', 'dark filter level':'Filtro oscuro', 'mix frames':'Mezcla de fotogramas',
    'audio resampler':'Remuestreo de audio', 'gb hwmode':'Modelo de consola', 'gb bootloader':'Pantalla de arranque',
    'up down allowed':'Permitir direcciones opuestas', 'turbo period':'Velocidad del turbo', 'rumble level':'Vibración',
    'gb model':'Modelo de Game Boy', 'use bios':'Usar BIOS', 'skip bios':'Saltar la intro de la BIOS', 'gb colors':'Paleta de Game Boy',
    'gb colors preset':'Paletas predefinidas', 'sgb borders':'Bordes de Super Game Boy', 'color correction':'Corrección de color',
    'interframe blending':'Mezcla entre fotogramas', 'audio low pass filter':'Filtro de audio', 'audio low pass range':'Intensidad del filtro de audio',
    'allow opposing directions':'Permitir direcciones opuestas', 'solar sensor level':'Sensor solar', 'force gbp':'Forzar Game Boy Player',
    'idle optimization':'Optimización en reposo', 'frameskip':'Salto de fotogramas', 'frameskip threshold':'Umbral del salto de fotogramas',
    'frameskip interval':'Intervalo del salto de fotogramas', 'screen layout':'Disposición de pantallas', 'screen gap':'Separación entre pantallas',
    'touch mode':'Modo táctil', 'boot directly':'Arrancar directo al juego', 'console mode':'Modo de consola', 'language':'Idioma del sistema',
    'hybrid ratio':'Proporción híbrida', 'swapscreen mode':'Intercambiar pantallas', 'randomize mac address':'MAC aleatoria',
    'jit enable':'Recompilador (JIT)', 'firmware language':'Idioma de la consola', 'use external bios':'Usar BIOS externa',
    'boot into bios':'Arrancar en la BIOS', 'load to memory':'Cargar el juego en memoria', 'num cores':'Núcleos del procesador',
    'advanced timing':'Sincronización avanzada', 'internal resolution':'Resolución interna', 'screens layout':'Disposición de pantallas',
    'screens gap':'Separación entre pantallas', 'hybrid layout ratio':'Proporción del modo híbrido', 'hybrid layout scale':'Escalar modo híbrido',
    'hybrid showboth screens':'Mostrar ambas pantallas en modo híbrido', 'hybrid cursor always smallscreen':'Cursor en la pantalla chica',
    'pointer mouse':'Usar mouse como lápiz', 'pointer type':'Tipo de puntero', 'mouse speed':'Velocidad del mouse', 'input rotation':'Rotación de controles',
    'gfx highres interpolate color':'Interpolar color en alta resolución', 'gfx linehack':'Corrección de líneas', 'gfx txthack':'Corrección de texturas',
    'gfx edgemark':'Marcado de bordes', 'gfx texture scaling':'Escalado de texturas', 'gfx texture deposterize':'Suavizado de texturas', 'threaded renderer':'Renderizado en hilos', 'opengl renderer':'Renderizador OpenGL'
  };
  const TRV = { 'show':'Mostrar', 'hide':'Ocultar', 'mostrar':'Mostrar', 'ocultar':'Ocultar', 'enabled':'Activado', 'disabled':'Desactivado',
    'Disabled':'Desactivado', 'Enabled':'Activado', 'auto':'Automático', 'Auto':'Automático', 'always':'Siempre', 'GBC only':'Solo GBC',
    'accurate':'Preciso', 'fast':'Rápido', 'central':'Centrada', 'above screen':'Sobre la pantalla', 'below screen':'Debajo de la pantalla',
    'internal':'Interna', 'custom':'Personalizada', 'mix':'Mezclar', 'none':'Ninguno', 'None':'Ninguno', 'ON':'Activado', 'OFF':'Desactivado',
    'native':'Nativa', 'Top/Bottom':'Arriba/Abajo', 'Bottom/Top':'Abajo/Arriba', 'Left/Right':'Izquierda/Derecha', 'Right/Left':'Derecha/Izquierda',
    'Top Only':'Solo superior', 'Bottom Only':'Solo inferior', 'Hybrid Top':'Híbrida superior', 'Hybrid Bottom':'Híbrida inferior',
    'Mouse':'Mouse', 'Touch':'Táctil', 'Joystick':'Joystick', 'Autodetect':'Automático', 'no':'No', 'yes':'Sí',
    'Grayscale':'Escala de grises', 'Remove Known':'Quitar conocidos', 'Detect and Remove':'Detectar y quitar', "Don't Remove":'No quitar',
    'Auto (Threshold)':'Automático (umbral)', 'top/bottom':'Arriba/Abajo', 'bottom/top':'Abajo/Arriba', 'left/right':'Izquierda/Derecha',
    'right/left':'Derecha/Izquierda', 'top only':'Solo superior', 'bottom only':'Solo inferior', 'hybrid/top':'Híbrida superior',
    'hybrid/bottom':'Híbrida inferior', 'mouse':'Mouse', 'touch':'Táctil', 'Japanese':'Japonés', 'English':'Inglés', 'French':'Francés',
    'German':'Alemán', 'Italian':'Italiano', 'Spanish':'Español', 'Fixed Interval':'Intervalo fijo', 'Auto':'Automático' };
  function trTitle(t){
    t = t.trim();
    if (TR[t]) return TR[t];
    const m = t.match(/^(gambatte|mgba|melonds|desmume|desmume2015)\s+(.+)$/i);
    if (m) { const k = m[2].toLowerCase(); return TR[k] || (k[0].toUpperCase() + k.slice(1)); }
    return t;
  }
  function trValue(v){
    v = v.trim();
    if (TRV[v]) return TRV[v];
    return v.replace(/^(\d+) deg$/, '$1°').replace(/^(\d+) seconds?$/, '$1 segundos').replace(/^1 minute$/, '1 minuto').replace(/^(\d+) minutes$/, '$1 minutos');
  }
  const settingEntries = [];
  function buildSettings(){
    const menu = emu()?.settingsMenu; if (!menu) return;
    const bars = [...menu.querySelectorAll('.ejs_settings_main_bar')];
    const groups = {};
    menu.querySelectorAll('.ejs_parent_option_div').forEach(div => {
      const rows = [...div.querySelectorAll(':scope > .ejs_setting_menu > .ejs_option_row')];
      if (!rows.length) return;
      const title = div.querySelector('.ejs_menu_text_a')?.textContent || '';
      const bar = bars.find(b => b.querySelector('span')?.firstChild?.textContent === title);
      const cat = bar?.closest('.ejs_parent_option_div')?.querySelector('.ejs_menu_text_a')?.textContent || 'General';
      (groups[cat] ||= []).push({ title, rows });
    });
    $('set-loading').remove();
    const grid = $('settings-grid');
    const coreCat = 'Backend Core Options';
    const order = ['Speed Options','Graphics Settings', coreCat, 'Save States','Input Options','Mando Virtual','Virtual Gamepad','General'];
    const cats = Object.keys(groups).sort((a,b) => (order.indexOf(a)+99)%99 - (order.indexOf(b)+99)%99);
    for (const cat of cats){
      const fs = document.createElement('fieldset'); fs.className = 'set-group';
      const coreName = { melonds:'melonDS', desmume:'DeSmuME', desmume2015:'DeSmuME 2015', gambatte:'Gambatte', mgba:'mGBA' }[emu().getCore()] || emu().getCore();
      fs.innerHTML = `<legend>${cat === coreCat ? `Núcleo del emulador (${coreName})` : trTitle(cat)}</legend>`;
      for (const { title, rows } of groups[cat]){
        const id = 'set-' + settingEntries.length;
        const lab = document.createElement('label'); lab.className = 'set-row'; lab.htmlFor = id;
        lab.textContent = trTitle(title);
        const sel = document.createElement('select'); sel.id = id;
        rows.forEach((r, i) => { const o = document.createElement('option'); o.value = i; o.textContent = trValue(r.textContent); sel.appendChild(o); });
        sel.onchange = () => { rows[+sel.value].click(); status(`${trTitle(title)}: ${sel.options[sel.selectedIndex].text}.`); focusGame(); };
        lab.appendChild(sel); fs.appendChild(lab);
        settingEntries.push({ sel, rows });
      }
      grid.appendChild(fs);
    }
    syncSettings();
  }
  function syncSettings(){
    for (const { sel, rows } of settingEntries){
      const i = rows.findIndex(r => r.classList.contains('ejs_option_row_selected'));
      if (i >= 0) sel.value = i;
    }
  }
  const SETTINGS_KEY = 'cartuchera-config-abierta';
  $('settings').open = localStorage.getItem(SETTINGS_KEY) !== '0';
  $('settings').addEventListener('toggle', () => { try { localStorage.setItem(SETTINGS_KEY, $('settings').open ? '1' : '0'); } catch {} if ($('settings').open) syncSettings(); });
  let paused = false;
  function setPaused(v){
    const e = emu();
    if (typeof e.pause === 'function' && typeof e.play === 'function') v ? e.pause() : e.play();
    else if (typeof e.togglePlaying === 'function') { if (!!e.paused !== v) e.togglePlaying(); }
    else gm().toggleMainLoop(v ? 0 : 1);
    paused = v;
    $('b-pause').setAttribute('aria-pressed', v); $('b-pause').textContent = v ? 'Reanudar' : 'Pausar';
  }
  $('b-pause').onclick = () => { setPaused(!paused); giveFocusBack(); };
  $('b-restart').onclick = () => {
    if (!confirm('¿Reiniciar el juego? Se pierde el progreso que no hayas guardado.')) return;
    gm().restart(); if (paused) setPaused(false); status('Juego reiniciado.'); giveFocusBack();
  };
  let fast = false;
  $('b-fast').onclick = () => {
    fast = !fast;
    try { emu().menuOptionChanged('fastForward', fast ? 'enabled' : 'disabled'); } catch { try { gm().toggleFastForward(fast ? 1 : 0); } catch {} }
    $('b-fast').setAttribute('aria-pressed', fast); giveFocusBack();
  };
  $('b-full').onclick = () => { const el = $('game-wrap'); (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); };
  $('vol').oninput = e => {
    const v = +e.target.value;
    if (typeof emu().setVolume === 'function') emu().setVolume(v); else { emu().volume = v; }
  };
  $('b-keys-reset').onclick = () => {
    const e = emu(); e.controls = JSON.parse(JSON.stringify(e.defaultControllers)); e.setupKeys(); e.checkGamepadInputs?.(); e.saveSettings();
    renderKeys(); status('Teclas restablecidas.'); focusGame();
  };
  // El mapeo de joysticks usa la ventana propia del emulador (detecta los botones del mando)
  $('b-pad').onclick = () => { const m = emu().controlMenu; if (m) m.style.display = ''; };
  $('vol').onchange = focusGame;

  $('slots').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.save) {
        const data = gm().getState();
        await idb('readwrite', st => st.put({ data, time: Date.now() }, `${g.id}:${b.dataset.save}`));
        status(`Estado guardado en la ranura ${b.dataset.save}.`);
      } else {
        const st = await idb('readonly', s => s.get(`${g.id}:${b.dataset.load}`));
        if (st) { gm().loadState(st.data); status(`Estado de la ranura ${b.dataset.load} cargado.`); }
      }
    } catch (err) { status('No se pudo completar la acción. Probá de nuevo.'); console.warn(err); }
    renderSlots(); giveFocusBack();
  };

  // Partida guardada (.sav)
  function readSave(){
    if (frozen) return frozen.slice();
    const m = gm(); if (!m) return null;
    try {
      if (typeof m.getSaveFile === 'function') { const d = m.getSaveFile(); if (d && d.length) return d; }
      m.saveSaveFiles?.();
      const path = m.getSaveFilePath?.();
      if (path && m.FS?.analyzePath(path).exists) return m.FS.readFile(path);
    } catch (err) { console.warn(err); }
    return null;
  }
  $('b-export').onclick = () => {
    const d = readSave();
    if (!d) return status('Todavía no hay partida guardada. Guardá dentro del juego primero.');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rawSave(d)])); a.download = `${g.id}.sav`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    status('Partida descargada.'); giveFocusBack();
  };
  $('b-import').onclick = () => $('f-import').click();
  // ---------- Escritura de partidas ----------
  // Congela el emulador (sin más autoguardados que pisen el archivo), escribe, persiste y recarga la página:
  // así todos los núcleos leen la partida nueva desde cero.
  let frozen = null;
  const DSV_TXT = new TextEncoder().encode('|<--Snip above here to create a raw sav by excluding this DeSmuME savedata footer:');
  function indexOfBytes(d, pat){
    outer: for (let i = d.length - pat.length; i >= 0; i--) { for (let j = 0; j < pat.length; j++) if (d[i + j] !== pat[j]) continue outer; return i; }
    return -1;
  }
  const rawSave = d => { const i = indexOfBytes(d, DSV_TXT); return i > 0 ? d.slice(0, i) : d; };  // sin el pie de DeSmuME
  async function writeSave(data){
    const m = gm(), e = emu(), FS = m.FS, path = m.getSaveFilePath();
    frozen = data;
    try { clearInterval(e.saveSaveInterval); e.saveSaveInterval = null; } catch {}
    try { m.toggleMainLoop(0); } catch {}
    const dir = path.substring(0, path.lastIndexOf('/'));
    try { if (dir && !FS.analyzePath(dir).exists) FS.mkdir(dir); } catch {}
    if (/\.dsv$/i.test(path) && indexOfBytes(data, DSV_TXT) < 0) {
      // DeSmuME convierte solo un .sav crudo al arrancar si no existe el .dsv
      FS.writeFile(path.replace(/\.dsv$/i, '.sav'), data);
      if (FS.analyzePath(path).exists) FS.unlink(path);
    } else {
      FS.writeFile(path, data);
    }
    await new Promise(r => FS.syncfs(false, r));
  }
  function reloadWith(msg){ try { sessionStorage.setItem('cartuchera-aviso', msg); } catch {} location.reload(); }
  try { const m = sessionStorage.getItem('cartuchera-aviso'); if (m) { status(m); sessionStorage.removeItem('cartuchera-aviso'); } } catch {}

  $('f-import').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (!confirm('Esto reemplaza la partida guardada actual de este juego. ¿Continuar?')) return;
    try { await writeSave(new Uint8Array(await f.arrayBuffer())); reloadWith('Partida cargada.'); }
    catch (err) { status('No se pudo cargar el archivo. Verificá que sea una partida de este juego.'); console.warn(err); }
  };

  // Respaldo automático antes de cada intercambio
  const BACKUP_KEY = `${g.id}:respaldo`;
  async function backup(data){ await idb('readwrite', st => st.put({ data, time: Date.now() }, BACKUP_KEY)); showRestore(); }
  async function showRestore(){
    let b = null; try { b = await idb('readonly', st => st.get(BACKUP_KEY)); } catch {}
    $('b-restore').hidden = !b;
    if (b) $('b-restore').title = `Respaldo del ${fmt(b.time)}`;
  }
  $('b-restore').onclick = async () => {
    if (!confirm('¿Volver a la partida que tenías antes del último intercambio? Se pierde lo que hayas hecho después.')) return;
    try { const b = await idb('readonly', st => st.get(BACKUP_KEY)); await writeSave(b.data); reloadWith('Partida restaurada.'); }
    catch { status('No se pudo restaurar el respaldo.'); }
  };

  // ---------- Equipo Pokémon ----------
  const teamBox = $('team'), toggle = $('team-toggle');
  const TEAM_KEY = 'cartuchera-mostrar-equipo';
  toggle.checked = localStorage.getItem(TEAM_KEY) !== '0';
  teamBox.classList.toggle('collapsed', !toggle.checked);
  toggle.onchange = () => {
    try { localStorage.setItem(TEAM_KEY, toggle.checked ? '1' : '0'); } catch {}
    teamBox.classList.toggle('collapsed', !toggle.checked);
    if (toggle.checked) updateTeam();
  };

  let lastTeam = '';
  function hpColor(r){ return r > .5 ? 'var(--ok)' : r > .2 ? 'var(--warn)' : 'var(--bad)'; }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function updateTeam(){
    if (!g.party || !toggle.checked || document.hidden || !ready) return;
    const team = PartyReader.read(readSave(), g.party);
    const key = JSON.stringify(team);
    if (key === lastTeam) return; lastTeam = key;
    $('team-empty').hidden = !!team;
    const list = $('team-list'); list.innerHTML = '';
    (team || []).forEach(m => {
      const li = document.createElement('li'); li.className = 'mon';
      if (m.egg) { li.innerHTML = `<div class="egg" aria-hidden="true"></div><div><div class="name">Huevo</div><div class="lvl">Todavía no eclosionó</div></div>`; list.appendChild(li); return; }
      const ratio = m.maxHp ? Math.max(0, Math.min(1, m.hp / m.maxHp)) : 0;
      const [src, fallback] = PartyReader.spriteUrls(g.party, m.dex, m.shiny);
      li.innerHTML = `<img alt="" loading="lazy" src="${src}">
        <div><div class="name"><span class="sp">Nº ${m.dex}</span><span class="nick"></span>${m.shiny ? '<span class="shiny">✦ Variocolor</span>' : ''}</div>
        <div class="lvl">Nivel ${m.level}</div>
        <div class="hp" role="img" aria-label="Salud ${m.hp} de ${m.maxHp}"><i style="width:${ratio*100}%;background:${hpColor(ratio)}"></i></div>
        <div class="hp-txt">PS ${m.hp}/${m.maxHp}</div></div>`;
      const img = li.querySelector('img');
      img.onerror = () => { img.onerror = null; img.src = fallback; };
      if (g.party === 'gen5') img.style.imageRendering = 'auto';
      PartyReader.speciesName(m.dex).then(n => {
        li.querySelector('.sp').textContent = n; img.alt = n;
        if (m.nickname && m.nickname.toLowerCase() !== n.toLowerCase()) li.querySelector('.nick').textContent = `“${m.nickname}”`;
      });
      list.appendChild(li);
    });
  }
  $('b-trade').onclick = () => window.openTrade?.();
  document.addEventListener('visibilitychange', updateTeam);
})();
</script>
</body>
</html>

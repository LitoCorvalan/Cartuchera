<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jugando — Cartuchera</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14162A; --surface:#1D2038; --surface2:#262A48; --ink:#E7E8F2; --muted:#9A9EBB; --line:#2E3253; --accent:#A49BFF;
  --ok:#5BD38A; --warn:#F2C14E; --bad:#F06A6A;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button,input,select{font:inherit;color:inherit}

.bar{display:flex;align-items:center;gap:14px;padding:12px clamp(12px,3vw,28px);border-bottom:1px solid var(--line)}
.back{color:var(--ink);text-decoration:none;font-weight:700;padding:6px 14px;border:1.5px solid var(--line);border-radius:999px;white-space:nowrap}
.back:hover{border-color:var(--ink)}
.title{min-width:0}
.title h1{font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,3vw,1.5rem);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p{margin:0;color:var(--muted);font-size:.85rem}
.swatch{width:14px;height:14px;border-radius:3px;flex:none}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"game team" "opts team";gap:18px 24px;padding:18px clamp(12px,3vw,28px) 32px;max-width:1400px;margin:0 auto}
.layout.no-team{grid-template-columns:minmax(0,1fr);grid-template-areas:"game" "opts"}
.game-area{grid-area:game;display:flex;justify-content:center}
#game-wrap{width:min(100%, calc((100dvh - 230px) * var(--ratio)));aspect-ratio:var(--ratio);background:#000;border-radius:8px;overflow:hidden}
#game{width:100%;height:100%}
/* Oculta la barra y el menú propios del emulador: las opciones están afuera */
.ejs_menu_bar,.ejs_context_menu{display:none!important}

/* Opciones */
.opts{grid-area:opts;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-start}
.group{display:flex;flex-direction:column;gap:8px}
.group h2,.team h2{font-family:var(--display);font-weight:500;font-size:1rem;margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.vol{display:flex;align-items:center;gap:8px;font-size:.9rem}
.vol input{width:110px;accent-color:var(--accent)}
.slots{display:grid;grid-template-columns:auto auto auto;gap:6px 8px;align-items:center;font-size:.9rem}
.slots .when{color:var(--muted);min-width:9ch}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 14px;font-size:.88rem;color:var(--muted);min-width:260px}
.keys kbd{font:inherit;color:var(--ink);background:var(--surface2);border-radius:4px;padding:0 6px;margin-left:4px}
@media (pointer:coarse){.keys-group{display:none}}
.status{font-size:.85rem;color:var(--muted);width:100%;margin:0}
.status:empty{display:none}

/* Equipo */
.team{grid-area:team;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.team-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.switch{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer}
.switch input{accent-color:var(--accent);width:18px;height:18px}
.team ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mon{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:6px 10px 8px 6px}
.mon img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated}
.mon .name{font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.mon .nick{font-weight:400;color:var(--muted);font-size:.85rem}
.mon .lvl{font-size:.85rem;color:var(--muted)}
.shiny{color:var(--warn);font-size:.8rem;font-weight:700}
.hp{height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.hp i{display:block;height:100%;border-radius:3px}
.hp-txt{font-size:.75rem;color:var(--muted);margin-top:2px}
.egg{width:34px;height:44px;margin:10px auto;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 35%,#fff,#E9E3CF 60%,#C9BFA0);box-shadow:inset -4px -4px 0 rgba(0,0,0,.08)}
.team-note{font-size:.82rem;color:var(--muted);margin:12px 0 0}
.team-empty{font-size:.9rem;color:var(--muted);margin:0}
.team.collapsed ol,.team.collapsed .team-note,.team.collapsed .team-empty{display:none}
.team.collapsed .team-head{margin-bottom:0}

.btn.primary{background:var(--accent);border-color:var(--accent);color:#14162A;font-weight:700}
.team-actions{margin-top:12px}
.team.collapsed .team-actions{display:none}

/* Intercambio */
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:0;width:min(760px,calc(100% - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(8,9,20,.7)}
.t-head{display:flex;justify-content:flex-end;padding:10px 10px 0}
.t-x{background:none;border:0;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 10px;border-radius:6px}
#trade-body{padding:0 24px 24px}
#trade-body h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0 0 8px}
#trade-body h3{font-size:.9rem;color:var(--muted);font-weight:700;margin:0 0 8px}
#trade-body p{margin:0 0 14px;max-width:62ch}
.t-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.t-or{color:var(--muted);font-size:.9rem;margin-top:22px!important}
.t-join{display:flex;gap:8px}
.t-join input{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;width:9ch;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
.t-code{font-family:var(--display);font-weight:800;font-size:2.6rem;letter-spacing:.12em;margin:4px 0 14px!important}
.t-wait{color:var(--muted)}
.t-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:14px 0}
.t-list{display:flex;flex-direction:column;gap:6px}
.t-mon{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:4px 10px 4px 4px;border:2px solid transparent;font-size:.92rem}
.t-mon img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}
.t-mon .lvl{color:var(--muted);font-size:.82rem}
.t-mon.dim{opacity:.45}
.t-mon.sel{border-color:var(--accent)}
.t-mon.empty{color:var(--muted);padding:16px}
.t-pick{display:block;cursor:pointer}
.t-pick input{position:absolute;opacity:0}
.t-pick input:checked + .t-mon{border-color:var(--accent)}
.t-pick input:focus-visible + .t-mon{outline:3px solid var(--accent);outline-offset:2px}
.t-evo{color:var(--warn);font-size:.9rem;margin-top:10px!important}
.t-state{color:var(--muted)}
.egg.sm{width:26px;height:34px;margin:7px 11px}
@media (max-width:620px){.t-cols{grid-template-columns:1fr}}

.msg{max-width:52ch;text-align:center;padding:40px 20px;margin:0 auto}
.msg h2{font-family:var(--display);margin:0 0 8px}
.msg code{background:var(--surface);padding:2px 6px;border-radius:4px}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"game" "team" "opts"}
  .team{position:static}
  #game-wrap{width:min(100%, calc((100dvh - 160px) * var(--ratio)))}
}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="./">Volver</a>
  <span class="swatch" id="swatch"></span>
  <div class="title"><h1 id="t">Cargando…</h1><p id="s"></p></div>
</div>

<div class="layout" id="layout">
  <div class="game-area" id="stage"><div id="game-wrap"><div id="game"></div></div></div>

  <div class="opts" id="opts">
    <div class="group">
      <h2>Juego</h2>
      <div class="row">
        <button class="btn" id="b-pause" aria-pressed="false" disabled>Pausar</button>
        <button class="btn" id="b-restart" disabled>Reiniciar</button>
        <button class="btn" id="b-fast" aria-pressed="false" disabled>Velocidad x2</button>
        <button class="btn" id="b-full" disabled>Pantalla completa</button>
      </div>
      <label class="vol">Volumen <input type="range" id="vol" min="0" max="1" step="0.05" value="0.5" disabled></label>
    </div>

    <div class="group">
      <h2>Estados rápidos</h2>
      <div class="slots" id="slots"></div>
    </div>

    <div class="group">
      <h2>Partida guardada</h2>
      <div class="row">
        <button class="btn" id="b-export" disabled>Descargar partida</button>
        <button class="btn" id="b-import" disabled>Cargar partida desde archivo</button>
        <input type="file" id="f-import" accept=".sav,.srm,.dsv,.sa1,.sa2" hidden>
        <button class="btn" id="b-restore" hidden>Restaurar partida previa al último intercambio</button>
      </div>
    </div>

    <div class="group keys-group">
      <h2>Controles del teclado</h2>
      <div class="keys" id="keys"></div>
      <div class="row"><button class="btn" id="b-keys" disabled hidden>Cambiar teclas</button></div>
    </div>

    <p class="status" id="status" role="status"></p>
  </div>

  <aside class="team" id="team" hidden>
    <div class="team-head">
      <h2>Tu equipo</h2>
      <label class="switch"><input type="checkbox" id="team-toggle" checked> Mostrar</label>
    </div>
    <ol id="team-list"></ol>
    <p class="team-empty" id="team-empty">Guardá la partida dentro del juego y tu equipo aparece acá.</p>
    <p class="team-note">Se actualiza cada vez que guardás dentro del juego.</p>
    <div class="team-actions"><button class="btn primary" id="b-trade" disabled>Intercambiar en línea</button></div>
  </aside>
</div>

<dialog id="trade" aria-label="Intercambio">
  <div class="t-head"><button class="t-x" aria-label="Cerrar" onclick="this.closest('dialog').close()">×</button></div>
  <div id="trade-body"></div>
</dialog>

<script src="games.js"></script>
<script src="party.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const id = new URLSearchParams(location.search).get('id');
  const g = GAMES.find(x => x.id === id);
  const status = msg => { $('status').textContent = msg; };
  const fail = (h, p) => {
    $('layout').innerHTML = `<div class="msg"><h2>${h}</h2><p>${p}</p></div>`;
    $('layout').classList.add('no-team'); $('t').textContent = h;
  };

  if (!g) return fail('Juego no encontrado', 'Volvé a la biblioteca y elegí un juego de la lista.');

  const p = PLATFORMS[g.platform];
  document.title = `${g.title} — Cartuchera`;
  $('t').textContent = g.title;
  $('s').textContent = `${p.name}, ${g.year}`;
  $('swatch').style.background = g.color;
  const ratios = { gb: 10/9, gbc: 10/9, gba: 3/2, nds: 2/3 };
  $('game-wrap').style.setProperty('--ratio', ratios[g.platform]);
  if (g.party) $('team').hidden = false; else $('layout').classList.add('no-team');

  // ---------- Controles del teclado ----------
  const BTN = { 0:'B', 1:'Y', 2:'Select', 3:'Start', 4:'Arriba', 5:'Abajo', 6:'Izquierda', 7:'Derecha', 8:'A', 9:'X', 10:'L', 11:'R' };
  const DEFAULT_KEYS = { 0:'x', 1:'s', 2:'v', 3:'enter', 4:'up arrow', 5:'down arrow', 6:'left arrow', 7:'right arrow', 8:'z', 9:'a', 10:'q', 11:'e' };
  const USED = { gb:[8,0,3,2,4,5,6,7], gbc:[8,0,3,2,4,5,6,7], gba:[8,0,10,11,3,2,4,5,6,7], nds:[8,0,9,1,10,11,3,2,4,5,6,7] }[g.platform];
  const KEYNAME = k => ({ 'up arrow':'↑', 'down arrow':'↓', 'left arrow':'←', 'right arrow':'→', 'enter':'Enter', 'space':'Espacio', 'shift':'Shift' }[k] || String(k).toUpperCase());
  function renderKeys(){
    const cur = window.EJS_emulator?.controls?.[0];
    $('keys').innerHTML = USED.map(i => {
      const k = cur?.[i]?.value || DEFAULT_KEYS[i];
      return `<span>${BTN[i]}<kbd>${KEYNAME(k)}</kbd></span>`;
    }).join('') + (g.platform==='nds' ? '<span>Pantalla táctil: mouse</span>' : '');
  }
  renderKeys();

  // ---------- Estados rápidos (IndexedDB propio) ----------
  const db = await new Promise(res => {
    try {
      const r = indexedDB.open('cartuchera', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('states');
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    } catch { res(null); }
  });
  const idb = (mode, fn) => new Promise((res, rej) => {
    if (!db) return rej(new Error('sin almacenamiento'));
    const tx = db.transaction('states', mode), st = tx.objectStore('states'), r = fn(st);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const fmt = t => new Date(t).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  async function renderSlots(){
    let html = '';
    for (const n of [1,2,3]){
      let st = null; try { st = await idb('readonly', s => s.get(`${g.id}:${n}`)); } catch {}
      html += `<span class="when">Ranura ${n}: ${st ? fmt(st.time) : 'vacía'}</span>
        <button class="btn" data-save="${n}" ${ready?'':'disabled'}>Guardar</button>
        <button class="btn" data-load="${n}" ${ready && st ? '' : 'disabled'}>Cargar</button>`;
    }
    $('slots').innerHTML = html;
  }
  let ready = false;
  renderSlots();

  // ---------- Verifica que exista el ROM ----------
  try { const r = await fetch(g.rom, { method: 'HEAD' }); if (!r.ok) throw 0; }
  catch { return fail('Falta el archivo del juego', `Subí el ROM a <code>${g.rom}</code> y recargá la página.`); }

  // ---------- EmulatorJS ----------
  window.EJS_player = '#game';
  window.EJS_core = p.core;
  window.EJS_gameUrl = g.rom;
  window.EJS_gameName = g.id;               // identifica las partidas guardadas: no cambiarlo
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_language = 'es-ES';
  window.EJS_color = g.color;
  window.EJS_backgroundColor = '#000000';
  window.EJS_volume = 0.5;
  window.EJS_Buttons = { playPause:false, restart:false, mute:false, settings:false, fullscreen:false, saveState:false, loadState:false,
    screenRecord:false, gamepad:false, cheat:false, volume:false, saveSavFiles:false, loadSavFiles:false, quickSave:false,
    quickLoad:false, screenshot:false, cacheManager:false, exitEmulation:false, netplay:false, diskButton:false, contextMenu:false };
  window.EJS_defaultControls = { 0: Object.fromEntries(Object.entries(DEFAULT_KEYS).map(([i,k]) => [i, { value:k }])), 1:{}, 2:{}, 3:{} };

  const emu = () => window.EJS_emulator;
  const gm = () => window.EJS_emulator?.gameManager;

  function onReady(){
    if (ready) return; ready = true;
    document.querySelectorAll('.opts .btn:not(#b-keys):not(#b-restore), #vol').forEach(b => b.disabled = false);
    if (emu()?.controlMenu) { $('b-keys').hidden = false; $('b-keys').disabled = false; }
    renderSlots(); renderKeys();
    if (g.party) {
      updateTeam(); setInterval(updateTeam, 4000); showRestore();
      window.Cartuchera = { game:g, readSave, writeSave, backup, status,
        pause: v => { try { if (v !== paused) setPaused(v); } catch {} },
        refreshTeam: () => { lastTeam = ''; setTimeout(updateTeam, 1500); } };
      const t = document.createElement('script'); t.src = 'trade.js';
      t.onload = () => { $('b-trade').disabled = false; };
      document.body.appendChild(t);
    }
  }
  window.EJS_onGameStart = onReady;
  const poll = setInterval(() => { if (gm()) { clearInterval(poll); setTimeout(onReady, 1500); } }, 500);

  const s = document.createElement('script');
  s.src = EJS_pathtodata + 'loader.js';
  s.onerror = () => fail('No se pudo cargar el emulador', 'Revisá tu conexión a internet y recargá la página.');
  document.body.appendChild(s);

  // ---------- Acciones ----------
  const giveFocusBack = () => document.activeElement?.blur?.();
  let paused = false;
  function setPaused(v){
    const e = emu();
    if (typeof e.pause === 'function' && typeof e.play === 'function') v ? e.pause() : e.play();
    else if (typeof e.togglePlaying === 'function') { if (!!e.paused !== v) e.togglePlaying(); }
    else gm().toggleMainLoop(v ? 0 : 1);
    paused = v;
    $('b-pause').setAttribute('aria-pressed', v); $('b-pause').textContent = v ? 'Reanudar' : 'Pausar';
  }
  $('b-pause').onclick = () => { setPaused(!paused); giveFocusBack(); };
  $('b-restart').onclick = () => {
    if (!confirm('¿Reiniciar el juego? Se pierde el progreso que no hayas guardado.')) return;
    gm().restart(); if (paused) setPaused(false); status('Juego reiniciado.'); giveFocusBack();
  };
  let fast = false;
  $('b-fast').onclick = () => {
    fast = !fast;
    try { gm().setFastForwardRatio?.(2); gm().toggleFastForward(fast ? 1 : 0); } catch {}
    $('b-fast').setAttribute('aria-pressed', fast); giveFocusBack();
  };
  $('b-full').onclick = () => { const el = $('game-wrap'); (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); };
  $('vol').oninput = e => {
    const v = +e.target.value;
    if (typeof emu().setVolume === 'function') emu().setVolume(v); else { emu().volume = v; }
  };
  $('b-keys').onclick = () => { const m = emu().controlMenu; if (m) { m.style.display = ''; const t = setInterval(() => { if (m.style.display === 'none') { clearInterval(t); renderKeys(); } }, 500); } };

  $('slots').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.save) {
        const data = gm().getState();
        await idb('readwrite', st => st.put({ data, time: Date.now() }, `${g.id}:${b.dataset.save}`));
        status(`Estado guardado en la ranura ${b.dataset.save}.`);
      } else {
        const st = await idb('readonly', s => s.get(`${g.id}:${b.dataset.load}`));
        if (st) { gm().loadState(st.data); status(`Estado de la ranura ${b.dataset.load} cargado.`); }
      }
    } catch (err) { status('No se pudo completar la acción. Probá de nuevo.'); console.warn(err); }
    renderSlots(); giveFocusBack();
  };

  // Partida guardada (.sav)
  function readSave(){
    const m = gm(); if (!m) return null;
    try {
      if (typeof m.getSaveFile === 'function') { const d = m.getSaveFile(); if (d && d.length) return d; }
      m.saveSaveFiles?.();
      const path = m.getSaveFilePath?.();
      if (path && m.FS?.analyzePath(path).exists) return m.FS.readFile(path);
    } catch (err) { console.warn(err); }
    return null;
  }
  $('b-export').onclick = () => {
    const d = readSave();
    if (!d) return status('Todavía no hay partida guardada. Guardá dentro del juego primero.');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([d])); a.download = `${g.id}.sav`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    status('Partida descargada.'); giveFocusBack();
  };
  $('b-import').onclick = () => $('f-import').click();
  function writeSave(data){
    const m = gm(), path = m.getSaveFilePath();
    const dir = path.substring(0, path.lastIndexOf('/'));
    if (dir && !m.FS.analyzePath(dir).exists) m.FS.mkdirTree?.(dir);
    m.FS.writeFile(path, data);
    m.loadSaveFiles(); m.restart();
    lastTeam = ''; setTimeout(updateTeam, 1500);
  }
  $('f-import').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (!confirm('Esto reemplaza la partida guardada actual de este juego. ¿Continuar?')) return;
    try { writeSave(new Uint8Array(await f.arrayBuffer())); status('Partida cargada. El juego se reinició para leerla.'); }
    catch (err) { status('No se pudo cargar el archivo. Verificá que sea una partida de este juego.'); console.warn(err); }
  };

  // Respaldo automático antes de cada intercambio
  const BACKUP_KEY = `${g.id}:respaldo`;
  async function backup(data){ await idb('readwrite', st => st.put({ data, time: Date.now() }, BACKUP_KEY)); showRestore(); }
  async function showRestore(){
    let b = null; try { b = await idb('readonly', st => st.get(BACKUP_KEY)); } catch {}
    $('b-restore').hidden = !b;
    if (b) $('b-restore').title = `Respaldo del ${fmt(b.time)}`;
  }
  $('b-restore').onclick = async () => {
    if (!confirm('¿Volver a la partida que tenías antes del último intercambio? Se pierde lo que hayas hecho después.')) return;
    try { const b = await idb('readonly', st => st.get(BACKUP_KEY)); writeSave(b.data); status('Partida restaurada.'); }
    catch { status('No se pudo restaurar el respaldo.'); }
  };

  // ---------- Equipo Pokémon ----------
  const teamBox = $('team'), toggle = $('team-toggle');
  const TEAM_KEY = 'cartuchera-mostrar-equipo';
  toggle.checked = localStorage.getItem(TEAM_KEY) !== '0';
  teamBox.classList.toggle('collapsed', !toggle.checked);
  toggle.onchange = () => {
    try { localStorage.setItem(TEAM_KEY, toggle.checked ? '1' : '0'); } catch {}
    teamBox.classList.toggle('collapsed', !toggle.checked);
    if (toggle.checked) updateTeam();
  };

  let lastTeam = '';
  function hpColor(r){ return r > .5 ? 'var(--ok)' : r > .2 ? 'var(--warn)' : 'var(--bad)'; }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function updateTeam(){
    if (!g.party || !toggle.checked || document.hidden || !ready) return;
    const team = PartyReader.read(readSave(), g.party);
    const key = JSON.stringify(team);
    if (key === lastTeam) return; lastTeam = key;
    $('team-empty').hidden = !!team;
    const list = $('team-list'); list.innerHTML = '';
    (team || []).forEach(m => {
      const li = document.createElement('li'); li.className = 'mon';
      if (m.egg) { li.innerHTML = `<div class="egg" aria-hidden="true"></div><div><div class="name">Huevo</div><div class="lvl">Todavía no eclosionó</div></div>`; list.appendChild(li); return; }
      const ratio = m.maxHp ? Math.max(0, Math.min(1, m.hp / m.maxHp)) : 0;
      const [src, fallback] = PartyReader.spriteUrls(g.party, m.dex, m.shiny);
      li.innerHTML = `<img alt="" loading="lazy" src="${src}">
        <div><div class="name"><span class="sp">Nº ${m.dex}</span><span class="nick"></span>${m.shiny ? '<span class="shiny">✦ Variocolor</span>' : ''}</div>
        <div class="lvl">Nivel ${m.level}</div>
        <div class="hp" role="img" aria-label="Salud ${m.hp} de ${m.maxHp}"><i style="width:${ratio*100}%;background:${hpColor(ratio)}"></i></div>
        <div class="hp-txt">PS ${m.hp}/${m.maxHp}</div></div>`;
      const img = li.querySelector('img');
      img.onerror = () => { img.onerror = null; img.src = fallback; };
      if (g.party === 'gen5') img.style.imageRendering = 'auto';
      PartyReader.speciesName(m.dex).then(n => {
        li.querySelector('.sp').textContent = n; img.alt = n;
        if (m.nickname && m.nickname.toLowerCase() !== n.toLowerCase()) li.querySelector('.nick').textContent = `“${m.nickname}”`;
      });
      list.appendChild(li);
    });
  }
  $('b-trade').onclick = () => window.openTrade?.();
  document.addEventListener('visibilitychange', updateTeam);
})();
</script>
</body>
</html>
